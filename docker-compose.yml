services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geosix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geosix_dev
      POSTGRES_USER: geosix
      POSTGRES_PASSWORD: geosix_password
    ports:
      - "5432:5432"
    volumes:
      - geosix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geosix -d geosix_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  geosix_postgres_data:
    driver: local
