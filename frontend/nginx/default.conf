# =============================================================================
# GEOSIX frontend nginx configuration (W41)
# =============================================================================
# This file replaces the stock single-page sample in
# nginxinc/nginx-unprivileged. It is mounted by Compose from
# frontend/nginx/default.conf and can also be used with a plain `nginx -c` setup.
#
# Two responsibilities:
#
#   1. Serve the built Vite bundle as a single-page application, with history
#      fallback so deep links such as /app/parcels or /login load index.html
#      instead of returning 404.
#   2. Reverse proxy /api/ to the backend service, so the browser keeps calling
#      a *relative* path on the frontend origin and no CORS preflight is needed
#      for same-origin traffic.
#
# Nothing here is secret. There are no credentials, no tokens, and no
# environment-specific hostnames other than the `backend` Compose service name,
# which is only ever resolved inside the Compose network.
# =============================================================================

# `resolver` is Docker's embedded DNS server. Using it with a variable in
# `proxy_pass` means nginx resolves `backend` at request time rather than only at
# startup, so a backend container restart with a new IP does not require an nginx
# restart. 127.0.0.11 is the resolver Docker injects into every container on a
# user-defined network, which is what Compose creates by default.
resolver 127.0.0.11 valid=10s ipv6=off;

# `map` is only valid in the http context. This file is included from inside the
# http block (see the image's /etc/nginx/nginx.conf), so declaring it here is valid
# and keeps the whole site config in one file instead of requiring a replacement
# main nginx.conf.
#
# Connection must be "upgrade" only while a request actually carries
# `Upgrade: websocket`; sending "Connection: upgrade" unconditionally breaks
# keepalive for ordinary API requests.
map $http_upgrade $geosix_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    # IPv6 is added by the base image's entrypoint script when it can write this
    # file, which the Dockerfile arranges by making it nginx-owned. Listing it here
    # too would be redundant.

    # `_` rather than a hostname: this container answers on whatever name the
    # deployment gives it, including `localhost` for local Compose use.
    server_name _;

    # The Vite build output, copied in from the Node build stage.
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Uploads (e.g. GeoJSON property imports) are not used by any current route,
    # but a cadastral dataset can be large, so the default 1 MB body limit is
    # raised. This is a transport limit only, not a validation one.
    client_max_body_size 32m;

    # -------------------------------------------------------------------------
    # Health probe target for the container HEALTHCHECK.
    # Handled locally so the check reports on nginx itself and does not fail just
    # because the backend is restarting.
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # API reverse proxy -> backend service.
    #
    # `backend` is the Compose service name and is resolvable *only* inside the
    # Compose network, which is precisely why the browser never sees it: the
    # browser calls the frontend origin and nginx forwards to the backend.
    # -------------------------------------------------------------------------
    location /api/ {
        # The upstream is held in a variable so the `resolver` above is actually
        # consulted. A literal `proxy_pass http://backend:8000;` would be resolved
        # once at startup and would keep pointing at a stale IP after the backend
        # container is recreated. `$request_uri` carries the original path and
        # query string, so /api/v1/health arrives at the backend unchanged and
        # /api/health arrives as /api/health -- both public, both documented.
        set $geosix_backend "http://backend:8000";
        proxy_pass $geosix_backend$request_uri;
        proxy_http_version 1.1;

        # Forward the real client address so the backend's per-IP login throttling
        # (LOGIN_MAX_ATTEMPTS / LOGIN_LOCKOUT_MINUTES) sees the browser address
        # and not nginx's.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade pass-through for future streaming endpoints. Uses the
        # map above so `Connection: upgrade` is only sent when actually upgrading.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $geosix_connection_upgrade;

        # Read timeout above the backend's default 60s response window, so nginx
        # does not drop a slow-but-valid cadastral query first.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Never buffer API responses to disk.
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Hashed build assets: immutable, so cache them hard.
    # Vite emits /assets/<name>-<hash>.js, and the content hash changes whenever
    # the file does.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA history fallback.
    #
    # React Router v7 uses the History API, so a hard navigation to /login or
    # /app/units/... is a request nginx must answer with index.html. Without this,
    # reloading any non-root route would 404.
    # -------------------------------------------------------------------------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Hardening: do not expose dotfiles or a source map of the server config,
    # and never let a path escape the document root.
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}