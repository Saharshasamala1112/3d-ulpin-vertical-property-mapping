repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig\.(app|node)\.json$
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with RUFF_VERSION in .gitlab-ci.yml so a local pre-commit run
    # and the CI lint stage cannot disagree about what ruff reports.
    rev: v0.16.10
    hooks:
      - id: ruff-check
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Oxlint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/
