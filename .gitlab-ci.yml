stages:
  - validate
  - test
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - backend/pyproject.toml
      - frontend/package-lock.json
  paths:
    - .cache/pip/
    - .npm/

backend:lint:
  stage: validate
  image: python:3.11-slim
  tags:
    - 3d_docker
  rules:
    - exists:
        - backend/pyproject.toml
  before_script:
    - cd backend
    - python -m pip install --disable-pip-version-check -e ".[dev]"
  script:
    - ruff check app tests
    - ruff format --check app tests

frontend:lint:
  stage: validate
  image: node:22-alpine
  tags:
    - 3d_docker
  rules:
    - exists:
        - frontend/package.json
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint

backend:test:
  stage: test
  image: python:3.11-slim
  rules:
    - exists:
        - backend/pyproject.toml
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  variables:
    POSTGRES_DB: geosix_test
    POSTGRES_USER: geosix
    POSTGRES_PASSWORD: geosix_password
    DATABASE_URL: "postgresql+psycopg://geosix:geosix_password@postgres:5432/geosix_test"
  tags:
    - 3d_docker
  before_script:
    - cd backend
    - python -m pip install --disable-pip-version-check -e ".[dev]"
    - |
      python - <<'PY'
      import os
      import time

      from sqlalchemy import create_engine

      engine = create_engine(os.environ["DATABASE_URL"])
      for attempt in range(60):
          try:
              with engine.connect():
                  break
          except Exception:
              if attempt == 59:
                  raise
              time.sleep(1)
      engine.dispose()
      PY
    - alembic upgrade head
  script:
    - pytest -q

frontend:test:
  stage: test
  image: node:22-alpine
  tags:
    - 3d_docker
  rules:
    - exists:
        - frontend/package.json
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm test

backend:build:
  stage: build
  image: python:3.11-slim
  tags:
    - 3d_docker
  rules:
    - exists:
        - backend/pyproject.toml
  before_script:
    - cd backend
    - python -m pip install --disable-pip-version-check -e .
  script:
    - python -m compileall -q app

frontend:build:
  stage: build
  image: node:22-alpine
  tags:
    - 3d_docker
  rules:
    - exists:
        - frontend/package.json
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

pipeline:check:
  stage: validate
  image: alpine:3.21
  tags:
    - 3d_docker
  script:
    - test -s .gitlab-ci.yml
