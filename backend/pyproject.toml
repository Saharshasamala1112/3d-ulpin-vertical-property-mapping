[project]
name = "geosix-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "shapely>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0,<1.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "GeoAlchemy2>=0.16.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.5.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
# The backend is a flat layout, so setuptools' auto-discovery would treat every
# top-level directory as a candidate package. `alembic` is a migration folder
# (no __init__.py) but PEP 420 discovery still picks it up, which fails the
# build with "Multiple top-level packages discovered in a flat-layout".
# Restrict discovery to the real application package; Alembic keeps working
# because it is used as a config/script directory, never imported as a package.
[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage is deliberately NOT enabled here: it adds roughly 9 seconds and would
# push a full run past the 30s budget. The >=80% gate is enforced in CI (see
# .gitlab-ci.yml) and can be run locally with:
#   pytest --cov=app --cov-report=term-missing
addopts = "-ra"
markers = [
    "integration: requires a real PostgreSQL/PostGIS database (TEST_DATABASE_URL)",
]

[tool.coverage.run]
# W13 acceptance criterion: coverage is measured over backend/app/.
source = ["app"]
branch = false
omit = [
    "alembic/*",
    "alembic/**",
    "*/alembic/*",
    "*/alembic/**",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
